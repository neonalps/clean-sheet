@let clubValue = club();
@let iconPositionValue = iconPosition();
<div class="flex align-items-center">
    <ng-container *ngIf="clubValue.iconSmall">
        <div [ngClass]="iconPositionValue === 'left' ? 'order-1 ml-2' : 'order-3 mr-2'">
            <app-club-icon [iconUrl]="clubValue.iconSmall" [iconClassName]="'width-sm img-max-h-24'"  />
        </div>
    </ng-container>
    <div class="order-2 mx-2 text-sm" [ngClass]="{ 'text-right': iconPositionValue === 'right' }">{{ clubValue.shortName }}</div>
</div>
