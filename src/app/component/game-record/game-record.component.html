@let gameRecordValue = gameRecord();
<div class="flex align-items-center justify-content-center py-3">
    <div class="px-3 min-w-120">
        <div class="flex justify-content-center">
            <span class="text-xl">{{ gameRecordValue.w }}</span>
        </div>
        <div class="mt-2 text-xs center text-light-grey-darker">{{ winsText() }}</div>
    </div>
    <div class="px-3 min-w-120">
        <div class="flex justify-content-center">
            <span class="text-xl">{{ gameRecordValue.d }}</span>
        </div>
        <div class="mt-2 text-xs center text-light-grey-darker">{{ drawsText() }}</div>
    </div>
    <div class="px-3 min-w-120">
        <div class="flex justify-content-center">
            <span class="text-xl">{{ gameRecordValue.l }}</span>
        </div>
        <div class="mt-2 text-xs center text-light-grey-darker">{{ lossesText() }}</div>
    </div>
</div>
