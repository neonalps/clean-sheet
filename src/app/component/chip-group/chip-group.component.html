@let chipGroupValue = chipGroup();
<div class="flex flex-wrap gap-y-4" [ngClass]="chipGroupValue.dynamicClassNamesContainer">
    @for (chip of chipGroupValue.chips; track $index) {
        <div class="chip-item">
            <app-chip [chip]="chip" [dynamicClassNames]="chipGroupValue.dynamicClassNamesChip" [dynamicBoundingClassNames]="chipGroupValue.chipBoundingClassNames" (click)="onClick(chip)" />
        </div>
    }
</div>
