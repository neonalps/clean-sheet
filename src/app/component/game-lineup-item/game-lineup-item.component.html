@let playerValue = player();
<div class="flex flex-col align-items-center transition-text pointer hover:text-light-darker-10">
    <div class="mb-2">
        <app-player-icon [iconUrl]="playerValue.avatar" [containerClass]="'max-w-2-dot-4'" [iconBgColorClass]="'bg-color-light-grey'" [yellowCard]="playerValue.yellowCard" [yellowRedCard]="playerValue.yellowRedCard" [redCard]="playerValue.redCard" [captain]="playerValue.captain === true" [off]="playerValue.off" [showPlaceholder]="showPersonPlaceholder()" />
    </div>
    <div class="text-lineup-item flex">
        <div class="mr-1 text-light-grey-darker">{{ playerValue.shirt }}</div>
        <div>{{ playerDisplayName() }}</div>
    </div>
</div>
