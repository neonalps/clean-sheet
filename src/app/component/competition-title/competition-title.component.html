@let competitionTitleValue = competitionTitle();
@let victoryGameValue = victoryGame();
<div>
    <div class="bold">{{ competitionTitleValue.season.name }}</div>
    <div *ngIf="victoryGameValue">
        <app-game-overview [game]="victoryGameValue" [showCompetitionName]="false" [showYear]="true" />
    </div>
</div>
