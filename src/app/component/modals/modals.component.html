<div class="transition-fade" [ngClass]="{ 'hidden-fade': !isActive() }">
    @switch (modalType()) {
        @case ('confirmAddPerson') {
            <app-modal-confirm-add-person />
        }
        @case ('delete') {
            <app-delete-modal />
        }
        @case ('filterGameList') {
            <app-modal-game-list-filter />
        }
        @case ('modifyClub') {
            <app-modal-modify-club />
        }
        @case ('modifyPerson') {
            <app-modal-modify-person />
        }
        @case ('modifyVenue') {
            <app-modal-modify-venue />
        }
        @case ('shirt') {
            <app-modal-select-shirt />
        }
        @case ('stats') {
            <app-stats-modal />
        }
        @case ('unsavedChanges') {
            <app-modal-unsaved-changes />
        }
    }
</div>
