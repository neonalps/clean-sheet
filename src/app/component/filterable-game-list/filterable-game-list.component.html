<div>
    <div class="mb-8">
        <app-game-record-summary [recordSummary]="gameRecordSummary()" [showExtendedSummary]="true" />
    </div>
    <div class="mb-4">
        <app-collapsible [isOpen]="filtersExpanded()" (onClicked)="triggerToggle()">
            <ng-container header>
                <div class="flex align-items-center pointer relative uppercase text-sm text-light-grey" [style.top]="'-3px'" (click)="triggerToggle()">
                    <div class="mr-2">
                        <div class="width-1-25rem relative top-1">
                            <app-filter-icon [fillColor]="effectiveFillColor()" />
                        </div>
                    </div>
                    <div class="relative" [style.top]="'-2px'">
                        <div class="hover:text-light-grey-darker">{{ 'list.filterOptions' | $t }}</div>
                    </div>
                </div>
            </ng-container>
            <ng-container content>
                @if (competitionFiltersVisible()) {
                    <div class="mt-3 ml-2">
                        <app-chip-group [chipGroup]="competitionChips()" (onSelected)="onCompetitionFilterChanged($event)" />
                    </div>
                }
                @if (homeAwayFiltersVisible()) {
                    <div class="mt-3 ml-2">
                        <app-chip-group [chipGroup]="homeAwayChips()" (onSelected)="onHomeAwayFilterChanged($event)" />
                    </div>
                }
                @if (tendencyFiltersVisible()) {
                    <div class="mt-3 ml-2">
                        <app-chip-group [chipGroup]="tendencyChips()" (onSelected)="onTendencyFilterChanged($event)" />
                    </div>
                }
                <div class="mb-2"></div>
            </ng-container>
        </app-collapsible>
    </div>
    <div appScrollNearEnd (nearEnd)="onNearEndScroll()">
        @for (game of visibleGames(); track game.id) {
            <app-game-overview [game]="game" [showYear]="true" (click)="triggerNavigateToGame(game)" />
        }
    </div>
</div>
