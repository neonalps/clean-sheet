@let activeValue = active();
@let tabIconValue = tabIcon();
<div #header class="tab-group-item flex relative align-items-center justify-content-center rounded-md px-4 py-2 pointer transition-colors" (click)="onHeaderClicked()" [ngClass]="{ 'no-break': !wordBreak(), 'bg-color-dark-grey-lighter': !activeValue, 'bg-color-dark-grey-darker': activeValue, 'text-light-grey-darker': !activeValue, 'text-light': activeValue, 'hover:bg-color-dark-grey-mid': !activeValue }">
    <div class="mr-2" [ngClass]="tabIconClasses()" *ngIf="tabIconValue">
        <app-ui-icon [descriptor]="tabIconValue" [iconClassName]="'img-max-h-24'" />
    </div>
    <div>{{ tabTitle() }}</div>
</div>
