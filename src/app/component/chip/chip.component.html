@let chipValue = chip();
<div class="flex justify-content-center align-items-center pointer transition-bg-color transition-text px-3 py-1 rounded-lg" [ngClass]="getBoundingClasses()">
    <ng-container *ngIf="chipValue.displayIcon">
        <div class="flex align-items-center">
            <div class="width-1-25rem" [ngClass]="{ 'mr-2': chipValue.displayText }">
                <app-ui-icon [descriptor]="chipValue.displayIcon" [ngClass]="chipValue.displayIcon.containerClasses" />
            </div>
        </div>
    </ng-container>
    <div class="fix-width-boldable" *ngIf="chipValue.displayText" [attr.x-content]="chipValue.displayText" [ngClass]="getDynamicClasses()">{{ chipValue.displayText }}</div>
</div>
