<app-modal>
    <div header>{{ 'club.edit' | $t }}</div>
    <div content>
        <app-modify-base-club [input]="baseClubInformationInput()" (onUpdate)="submittablePayload.set($event)" />
    </div>
    <div footer>
        <div class="flex justify-content-center">
            <div class="w-full">
                <div class="flex align-items-center justify-content-between mt-12">
                    <app-button class="mx-4" [buttonType]="'secondary'" [text]="'action.cancel' | $t" (onClicked)="onCancel()" />
                    <app-button class="mx-4" [buttonType]="'success'" [enabled]="isSubmittable()" [text]="'action.save' | $t" (onClicked)="onConfirm()" />
                </div>
            </div>
        </div>
    </div>
</app-modal>
