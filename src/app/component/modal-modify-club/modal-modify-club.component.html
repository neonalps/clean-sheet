@let isEditingValue = isEditing();
<app-modal>
    <div header>{{ (isEditingValue ? 'club.edit' : 'club.create') | $t }}</div>
    <div content>
        <div class="form-row">
            <div class="form-row-title">{{ 'club.name' | $t }}</div>
            <div class="form-row-content">
                <input #fullName type="text" class="input-text w-full px-2 py-1 text-lg text-light bg-color-dark-grey-lighter" (input)="onFullNameChange()" />
            </div>
        </div>
        <div class="form-row">
            <div class="form-row-title">{{ 'club.shortName' | $t }}</div>
            <div class="form-row-content">
                <input #shortName type="text" class="input-text w-full px-2 py-1 text-lg text-light bg-color-dark-grey-lighter" (input)="onShortNameChange()" />
            </div>
        </div>
        <div class="form-row">
            <div class="form-row-title">{{ 'club.city' | $t }}</div>
            <div class="form-row-content">
                <input #city type="text" class="input-text w-full px-2 py-1 text-lg text-light bg-color-dark-grey-lighter" (input)="onCityChange()" />
            </div>
        </div>
        <div class="form-row">
            <div class="form-row-title">{{ 'club.country' | $t }}</div>
            <div class="form-row-content">
                <app-select-nationalities [selectedNationalities]="emulatedNationalitiesValue()" (onValueChange)="onNationalitiesChanged($event)" />
            </div>
        </div>
    </div>
    <div footer>
        <div class="flex justify-content-center">
            <div class="w-full">
                <div class="flex align-items-center justify-content-between mt-12">
                    <app-button class="mx-4" [buttonType]="'secondary'" [text]="'action.cancel' | $t" (onClicked)="onCancel()" />
                    <app-button class="mx-4" [buttonType]="'success'" [text]="'action.save' | $t" (onClicked)="onConfirm()" />
                </div>
            </div>
        </div>
    </div>
</app-modal>
