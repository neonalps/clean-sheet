@let clubValue = club();
<div class="p-2 flex align-items-center justify-content-center">
    <div class="flex flex-col align-items-center justify-content-center transition-bg-color pointer hover:bg-color-dark-grey rounded-lg p-1 min-w-140">
        @if (clubValue.iconSmall) {
            <div class="my-2">
                <app-club-icon [iconUrl]="clubValue.iconSmall" [iconClassName]="'width-lg img-max-h-64'"  />
            </div>
        }
        <div class="order-2 min-h-48 mx-2 text-base flex align-items-center justify-content-center center">{{ clubValue.name }}</div>
    </div>
</div>
