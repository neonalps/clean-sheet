<app-modal>
    <div header>{{ 'person.edit' | $t }}</div>
    <div content>
        <div class="form-row">
            <div class="form-row-title">{{ 'person.firstName' | $t }}</div>
            <div class="form-row-content">
                <input #firstName type="text" class="input-text w-full px-2 py-1 text-lg text-light" (input)="onFirstNameChange()" />
            </div>
        </div>
        <div class="form-row">
            <div class="form-row-title">{{ 'person.lastName' | $t }}</div>
            <div class="form-row-content">
                <input #lastName type="text" class="input-text w-full px-2 py-1 text-lg text-light" (input)="onLastNameChange()" />
            </div>
        </div>
    </div>
    <div footer>
        <div class="flex justify-content-center">
            <div class="w-full">
                <div class="flex align-items-center justify-content-between mt-12">
                    <app-button class="mx-4" [buttonType]="'secondary'" [text]="'action.cancel' | $t" (onClicked)="onCancel()" />
                    <app-button class="mx-4" [buttonType]="'success'" [text]="'action.save' | $t" (onClicked)="onConfirm()" />
                </div>
            </div>
        </div>
    </div>
</app-modal>
