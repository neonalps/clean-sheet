@let personValue = person();
@let textSizeValue = textSize();
<div class="flex align-items-center" [ngClass]="clickable() ? 'pointer hover:text-light-grey-darker transition-colors'  : ''" (click)="handleClick()">
    <div class="basis-1/10 flex align-items-center justify-content-center" [ngClass]="iconMargin()" *ngIf="personValue.avatar">
        <div [ngClass]="iconContainerWidth()">
            <app-ui-icon [descriptor]="{ 'type': 'person', 'content': personValue.avatar }" />
        </div>
    </div>
    <div class="flex align-items-center" [ngClass]="textSizeValue">
        @if (personValue.firstName) {
            <span class="mr-1">{{ personValue.firstName }}</span>
        }
        <span [ngClass]="{ 'bold': lastNameBold() }">{{ personValue.lastName }}</span>
        @if (showNationalities()) {
            <span class="ml-2">
                <app-nationalities [nationalities]="nationalities()" />
            </span>
        }
    </div>
</div>
