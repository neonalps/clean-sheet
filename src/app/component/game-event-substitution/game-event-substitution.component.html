@let eventValue = event();
<app-game-event [event]="eventValue">
    <div info>
        <div class="flex flex-col align-items-center justify-content-center">
            <div class="arrow-right-container">
                <app-arrow-right [color]="'green'" />
            </div>
            <div class="arrow-left-container">
                <app-arrow-left [color]="'red'" />
            </div>
        </div>
    </div>
    <div person>
        <div class="game-event-scored-by text-sm">{{ playerOn() }}</div>
        <div class="text-sm text-light-grey">
            {{ playerOff() }}
            <span *ngIf="eventValue.injured" class="inline-block ml-1 text-danger-lighter-30" [attr.title]="'injured' | $t">+</span>
        </div>
    </div>
</app-game-event>
