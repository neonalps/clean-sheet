@let text = displayText();
<div class="inline-flex align-items-center" [class.pointer]="!disabled()" (click)="onClicked()">
    <div class="width-1-25rem relative top-1">
        <app-star-icon [fillColor]="effectiveFillColor()" />
    </div>
    @if (text) {
        <div class="ml-3 text-sm user-select-none">{{ text }}</div>
    }
</div>
